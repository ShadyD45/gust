# DISABLED until NPM_TOKEN is configured in repo secrets.
# TODO: Re-enable this workflow (remove the job-level `if: false`) after adding
# NPM_TOKEN, then publish sdk/typescript on v* tags.
#
# Publishes sdk/typescript to npm when a v* tag is pushed.
name: publish-npm
run-name: "${{ github.workflow }} : ${{ github.head_ref || github.ref_name }}"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    if: false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
