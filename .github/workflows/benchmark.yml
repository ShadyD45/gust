# Self-AEE + judge calibration.
# Writes results to the job summary and uploads artifacts.
# Does not push or open PRs — refresh benchmarks/RESULTS.md locally when needed.
name: benchmark
run-name: "benchmark : ${{ github.head_ref || github.ref_name }}"

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "**/*.png"
      - "LICENSE"
      - ".gitignore"
      - "benchmarks/RESULTS.md"
      - "benchmarks/fixtures/*.json"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "**/*.png"
      - "LICENSE"
      - ".gitignore"
      - "benchmarks/RESULTS.md"
      - "benchmarks/fixtures/*.json"
  workflow_dispatch:

concurrency:
  group: benchmark-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  aee:
    name: AEE self-report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -o gust ./cmd/gust

      - name: AEE report
        run: |
          ./gust aee report \
            --out benchmarks/fixtures/gust_self_aee.json \
            --doc benchmarks/RESULTS.md \
            --site-doc docs/benchmarks/results.md

      - name: Judge calibrate (mock harness)
        run: |
          ./gust judge calibrate \
            --provider mock \
            --dataset testdata/judge/calibration/v1.json \
            --out "${{ runner.temp }}/judge-cal.json"

      - name: Job summary
        run: |
          {
            echo "## AEE self-report"
            echo ""
            echo "Latest workflow runs: [benchmark](https://github.com/ShadyD45/gust/actions/workflows/benchmark.yml)"
            echo ""
            echo "Checked-in numbers live in \`benchmarks/RESULTS.md\` (updated manually from local when needed)."
            echo ""
            echo "### This run"
            echo ""
            cat benchmarks/RESULTS.md
            echo ""
            echo "### Judge calibrate (mock)"
            echo ""
            if command -v jq >/dev/null 2>&1; then
              jq -r '"Spearman ρ = \(.spearman_rho // .spearman // "n/a")"' "${{ runner.temp }}/judge-cal.json" 2>/dev/null \
                || echo "_See artifact / calibrate JSON for details._"
            else
              echo "_Mock calibrate completed — see uploaded artifacts for AEE JSON._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aee-report
          path: |
            benchmarks/RESULTS.md
            benchmarks/fixtures/gust_self_aee.json
            docs/benchmarks/results.md
          if-no-files-found: error
