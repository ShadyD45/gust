# DISABLED until PYPI_API_TOKEN is configured in repo secrets.
# TODO: Re-enable this workflow (remove the job-level `if: false`) after adding
# PYPI_API_TOKEN, then publish sdk/python on v* tags.
#
# Publishes sdk/python to PyPI when a v* tag is pushed.
name: publish-pypi
run-name: "${{ github.workflow }} : ${{ github.head_ref || github.ref_name }}"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypi:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        working-directory: sdk/python
        run: |
          python -m pip install --quiet build
          python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: sdk/python/dist
