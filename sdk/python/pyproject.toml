[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gust-sdk"
version = "0.5.0"
description = "Capture agent runs for gust, the test infrastructure for autonomous software"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["llm", "agents", "testing", "evaluation", "observability"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
# Standard library only by default: the SDK captures and writes JSON. The Go
# binary remains the evaluation authority. Optional judge extras wrap official
# provider SDKs for llm_judge wire plugins.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
langchain = ["langchain-core>=0.2"]
judge-openai = ["openai>=1.40"]
judge-anthropic = ["anthropic>=0.34"]
judge-google = ["google-genai>=0.3"]
judge-ollama = ["ollama>=0.3"]
judge = [
  "openai>=1.40",
  "anthropic>=0.34",
  "google-genai>=0.3",
  "ollama>=0.3",
]

[project.urls]
Homepage = "https://github.com/ShadyD45/gust"
Documentation = "https://github.com/ShadyD45/gust/tree/main/docs/usage"

[tool.hatch.build.targets.wheel]
packages = ["gust_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
